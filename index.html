const slides=[{"group":"MỞ ĐẦU","emoji":"🌡️","title":"Sự giãn nở vì nhiệt","body":"Vì sao vật thay đổi kích thước khi nhiệt độ thay đổi? Đây là hiện tượng quen thuộc trong đời sống và kỹ thuật."},{"group":"MỞ ĐẦU","emoji":"🌡️","title":"Ngày nắng nóng","body":"Cầu, đường ray, đường ống và dây điện đều chịu ảnh hưởng của nhiệt độ."},{"group":"MỞ ĐẦU","emoji":"🌡️","title":"Câu hỏi khởi động","body":"Vì sao cầu có khe nối? Vì sao dây điện thường võng xuống nhiều hơn vào ngày nóng?"},{"group":"MỞ ĐẦU","emoji":"🌡️","title":"Mục tiêu bài học","body":"Nêu khái niệm, so sánh chất rắn–lỏng–khí và giải thích ứng dụng thực tế."},{"group":"MỞ ĐẦU","emoji":"🌡️","title":"Lộ trình","body":"Bài gồm khái niệm, mô hình hạt, ba trạng thái vật chất, ứng dụng, thí nghiệm và ôn tập."},{"group":"MỞ ĐẦU","emoji":"🌡️","title":"Khoa học quanh ta","body":"Một thay đổi nhỏ ở cấp độ hạt có thể ảnh hưởng đến những công trình rất lớn."},{"group":"MỞ ĐẦU","emoji":"🌡️","title":"Dự đoán trước","body":"Hãy thử dự đoán vật thay đổi ra sao khi được làm nóng, rồi kiểm tra bằng kiến thức khoa học."},{"group":"MỞ ĐẦU","emoji":"🌡️","title":"Từ sách đến đời sống","body":"Sự giãn nở vì nhiệt giúp giải thích nhiệt kế, khe co giãn và nhiều thiết bị quen thuộc."},{"group":"MỞ ĐẦU","emoji":"🌡️","title":"Câu hỏi trung tâm","body":"Khi nhiệt độ thay đổi, kích thước của vật có luôn giữ nguyên không?"},{"group":"MỞ ĐẦU","emoji":"🌡️","title":"Bắt đầu khám phá","body":"Cùng tìm hiểu vì sao nhiệt độ có thể khiến vật nở ra hoặc co lại."},{"group":"KHÁI NIỆM","emoji":"📘","title":"Định nghĩa","body":"Sự giãn nở vì nhiệt là hiện tượng kích thước hoặc thể tích của vật thay đổi khi nhiệt độ thay đổi."},{"group":"KHÁI NIỆM","emoji":"📘","title":"Khi nóng lên","body":"Phần lớn vật nở ra khi được làm nóng; chiều dài, diện tích hoặc thể tích có thể tăng."},{"group":"KHÁI NIỆM","emoji":"📘","title":"Khi lạnh đi","body":"Phần lớn vật co lại khi nhiệt độ giảm, nên kích thước thường nhỏ hơn lúc nóng hơn."},{"group":"KHÁI NIỆM","emoji":"📘","title":"Quy luật phổ biến","body":"Nở khi nóng và co khi lạnh là quy luật phổ biến, nhưng vẫn có ngoại lệ."},{"group":"KHÁI NIỆM","emoji":"📘","title":"Kích thước nào đổi?","body":"Tùy vật, ta có thể quan tâm đến chiều dài, chiều rộng, diện tích hoặc thể tích."},{"group":"KHÁI NIỆM","emoji":"📘","title":"Thay đổi rất nhỏ","body":"Độ giãn nở đôi khi khó thấy bằng mắt thường nên cần cách quan sát phù hợp."},{"group":"KHÁI NIỆM","emoji":"📘","title":"Không sinh thêm chất","body":"Khi vật nở ra, vật không tự sinh thêm vật chất; kích thước thay đổi do cấu trúc bên trong."},{"group":"KHÁI NIỆM","emoji":"📘","title":"Co lại không mất đi","body":"Khi co lại, lượng vật chất vẫn còn; chỉ kích thước của vật thay đổi."},{"group":"KHÁI NIỆM","emoji":"📘","title":"Nhiệt độ và kích thước","body":"Sự thay đổi nhiệt độ thường kéo theo thay đổi kích thước, tùy vật liệu và điều kiện."},{"group":"KHÁI NIỆM","emoji":"📘","title":"Ví dụ đơn giản","body":"Mực chất lỏng trong một số nhiệt kế dịch chuyển khi nhiệt độ thay đổi."},{"group":"MÔ HÌNH HẠT","emoji":"⚛️","title":"Vật chất gồm các hạt","body":"Vật chất được cấu tạo từ những hạt rất nhỏ; các hạt luôn chuyển động và tương tác."},{"group":"MÔ HÌNH HẠT","emoji":"⚛️","title":"Khi nhận nhiệt","body":"Nhiệt độ tăng thường làm chuyển động nhiệt của các hạt mạnh hơn."},{"group":"MÔ HÌNH HẠT","emoji":"⚛️","title":"Khoảng cách trung bình","body":"Trong nhiều vật liệu, khoảng cách trung bình giữa các hạt tăng khi vật nóng lên."},{"group":"MÔ HÌNH HẠT","emoji":"⚛️","title":"Vì sao vật nở?","body":"Khoảng cách trung bình tăng có thể làm kích thước tổng thể của vật tăng."},{"group":"MÔ HÌNH HẠT","emoji":"⚛️","title":"Khi nguội đi","body":"Chuyển động nhiệt thường yếu hơn, nên vật liệu có xu hướng co lại."},{"group":"MÔ HÌNH HẠT","emoji":"⚛️","title":"Mô hình minh họa","body":"Hãy tưởng tượng các hạt như những điểm nhỏ liên kết với nhau; khoảng cách có thể thay đổi."},{"group":"MÔ HÌNH HẠT","emoji":"⚛️","title":"Hạt không đơn giản phình to","body":"Không nên giải thích rằng từng hạt tự lớn lên; cần chú ý chuyển động và khoảng cách."},{"group":"MÔ HÌNH HẠT","emoji":"⚛️","title":"Nhiệt độ và năng lượng","body":"Nhiệt độ liên quan đến mức độ chuyển động nhiệt của các hạt trong vật chất."},{"group":"MÔ HÌNH HẠT","emoji":"⚛️","title":"Vật liệu khác nhau","body":"Cấu trúc và liên kết giữa các hạt khác nhau khiến vật liệu giãn nở khác nhau."},{"group":"MÔ HÌNH HẠT","emoji":"⚛️","title":"Từ vi mô đến vĩ mô","body":"Chuyển động ở cấp độ hạt giúp giải thích thay đổi kích thước quan sát được."},{"group":"CHẤT RẮN","emoji":"🧱","title":"Đặc điểm","body":"Chất rắn thường giữ hình dạng riêng; nhiều chất rắn tăng kích thước khi nóng lên."},{"group":"CHẤT RẮN","emoji":"🧱","title":"Thanh kim loại","body":"Một thanh kim loại được làm nóng có thể dài hơn một chút so với ban đầu."},{"group":"CHẤT RẮN","emoji":"🧱","title":"Tấm kim loại","body":"Chiều rộng và diện tích của tấm kim loại cũng có thể tăng khi nhiệt độ tăng."},{"group":"CHẤT RẮN","emoji":"🧱","title":"Thể tích","body":"Khi các kích thước tăng, thể tích của vật rắn thường cũng tăng."},{"group":"CHẤT RẮN","emoji":"🧱","title":"Khi nguội","body":"Vật rắn thường co lại khi nhiệt độ giảm."},{"group":"CHẤT RẮN","emoji":"🧱","title":"Hai vật liệu","body":"Hai thanh cùng kích thước ban đầu có thể giãn nở khác nhau nếu làm từ vật liệu khác nhau."},{"group":"CHẤT RẮN","emoji":"🧱","title":"Chiều dài ban đầu","body":"Với nhiều vật liệu, vật ban đầu càng dài thì độ tăng chiều dài tuyệt đối có thể càng lớn."},{"group":"CHẤT RẮN","emoji":"🧱","title":"Bị cản trở","body":"Nếu vật muốn nở nhưng bị giữ chặt, ứng suất có thể tăng và làm kết cấu biến dạng."},{"group":"CHẤT RẮN","emoji":"🧱","title":"Lỗ trên tấm","body":"Khi một tấm rắn nở đều, kích thước lỗ trên tấm thường cũng tăng."},{"group":"CHẤT RẮN","emoji":"🧱","title":"Tóm tắt chất rắn","body":"Nhiều chất rắn nở khi nóng và co khi lạnh; mức độ phụ thuộc vật liệu và nhiệt độ."},{"group":"CHẤT LỎNG","emoji":"💧","title":"Đặc điểm","body":"Chất lỏng có thể tích tương đối xác định nhưng nhận hình dạng của bình chứa."},{"group":"CHẤT LỎNG","emoji":"💧","title":"Khi nóng lên","body":"Nhiều chất lỏng tăng thể tích khi nhiệt độ tăng."},{"group":"CHẤT LỎNG","emoji":"💧","title":"Khi lạnh đi","body":"Nhiều chất lỏng giảm thể tích khi nhiệt độ giảm trong điều kiện thông thường."},{"group":"CHẤT LỎNG","emoji":"💧","title":"Mực chất lỏng","body":"Trong ống hẹp, thay đổi thể tích có thể làm mực chất lỏng dịch chuyển dễ thấy."},{"group":"CHẤT LỎNG","emoji":"💧","title":"Nhiệt kế","body":"Một số nhiệt kế dùng sự thay đổi thể tích chất lỏng để biểu thị nhiệt độ."},{"group":"CHẤT LỎNG","emoji":"💧","title":"Ống nhỏ","body":"Ống hẹp biến đổi thể tích thành sự thay đổi chiều cao của cột chất lỏng."},{"group":"CHẤT LỎNG","emoji":"💧","title":"Chất lỏng khác nhau","body":"Mỗi chất lỏng có đặc tính giãn nở riêng, không phải chất nào cũng giống nhau."},{"group":"CHẤT LỎNG","emoji":"💧","title":"Bình chứa","body":"Khi đo, cần nhớ bình chứa cũng có thể thay đổi kích thước theo nhiệt độ."},{"group":"CHẤT LỎNG","emoji":"💧","title":"Nước đặc biệt","body":"Nước có sự thay đổi thể tích khác thường trong khoảng gần điểm đóng băng."},{"group":"CHẤT LỎNG","emoji":"💧","title":"Tóm tắt chất lỏng","body":"Chất lỏng thường nở khi nóng; nhiệt kế là ứng dụng quen thuộc của hiện tượng này."},{"group":"CHẤT KHÍ","emoji":"💨","title":"Đặc điểm","body":"Chất khí không có hình dạng và thể tích cố định như chất rắn."},{"group":"CHẤT KHÍ","emoji":"💨","title":"Khí nóng lên","body":"Chất khí có xu hướng nở ra khi được làm nóng nếu có điều kiện cho phép."},{"group":"CHẤT KHÍ","emoji":"💨","title":"Khí lạnh đi","body":"Chất khí có thể co lại khi nhiệt độ giảm, tùy áp suất và điều kiện xung quanh."},{"group":"CHẤT KHÍ","emoji":"💨","title":"Mức giãn nở","body":"Trong điều kiện so sánh phù hợp, chất khí thường thay đổi thể tích rõ hơn chất rắn."},{"group":"CHẤT KHÍ","emoji":"💨","title":"Bóng bay","body":"Không khí trong bóng có thể thay đổi thể tích theo nhiệt độ; độ đàn hồi của bóng cũng ảnh hưởng."},{"group":"CHẤT KHÍ","emoji":"💨","title":"Khinh khí cầu","body":"Không khí nóng có khối lượng riêng thấp hơn không khí xung quanh trong điều kiện phù hợp, góp phần tạo lực nâng."},{"group":"CHẤT KHÍ","emoji":"💨","title":"Khối lượng riêng","body":"Nếu cùng lượng khí chiếm thể tích lớn hơn, khối lượng riêng của khí sẽ giảm."},{"group":"CHẤT KHÍ","emoji":"💨","title":"Bình kín","body":"Khí nóng lên trong bình kín có thể làm áp suất tăng cao. Không tự ý đun nóng bình kín."},{"group":"CHẤT KHÍ","emoji":"💨","title":"Lốp xe","body":"Nhiệt độ ảnh hưởng trạng thái không khí trong lốp; kiểm tra áp suất theo hướng dẫn nhà sản xuất."},{"group":"CHẤT KHÍ","emoji":"💨","title":"Tóm tắt chất khí","body":"Sự thay đổi của chất khí phụ thuộc nhiệt độ, áp suất và khả năng thay đổi thể tích."},{"group":"SO SÁNH VÀ YẾU TỐ","emoji":"📊","title":"Ba trạng thái","body":"Chất rắn, chất lỏng và chất khí đều có thể thay đổi kích thước hoặc thể tích khi nhiệt độ đổi."},{"group":"SO SÁNH VÀ YẾU TỐ","emoji":"📊","title":"So sánh chất rắn","body":"Với chất rắn, chiều dài và kích thước các chi tiết thường rất quan trọng."},{"group":"SO SÁNH VÀ YẾU TỐ","emoji":"📊","title":"So sánh chất lỏng","body":"Với chất lỏng, thay đổi thể tích có thể được quan sát qua mực chất lỏng."},{"group":"SO SÁNH VÀ YẾU TỐ","emoji":"📊","title":"So sánh chất khí","body":"Với chất khí, thể tích và áp suất đều là yếu tố cần chú ý."},{"group":"SO SÁNH VÀ YẾU TỐ","emoji":"📊","title":"Mức độ thường gặp","body":"Trong điều kiện phù hợp, chất khí thường giãn nở nhiều hơn chất lỏng và chất rắn."},{"group":"SO SÁNH VÀ YẾU TỐ","emoji":"📊","title":"Không chỉ do trạng thái","body":"Thành phần vật liệu và điều kiện thí nghiệm cũng ảnh hưởng kết quả."},{"group":"SO SÁNH VÀ YẾU TỐ","emoji":"📊","title":"Độ thay đổi nhiệt độ","body":"Độ thay đổi nhiệt độ càng lớn thì mức giãn nở thường càng lớn nếu điều kiện khác tương tự."},{"group":"SO SÁNH VÀ YẾU TỐ","emoji":"📊","title":"Vật liệu","body":"Các vật liệu có đặc tính giãn nở khác nhau, nên cần chọn phù hợp với môi trường sử dụng."},{"group":"SO SÁNH VÀ YẾU TỐ","emoji":"📊","title":"Kích thước ban đầu","body":"Với nhiều vật liệu, vật ban đầu càng dài thì độ tăng chiều dài tuyệt đối có thể càng lớn."},{"group":"SO SÁNH VÀ YẾU TỐ","emoji":"📊","title":"Làm nóng không đều","body":"Nếu các phần của vật nóng lên khác nhau, chúng có thể giãn nở khác nhau và tạo ứng suất."},{"group":"ỨNG DỤNG","emoji":"🌉","title":"Khe co giãn trên cầu","body":"Khe co giãn cho phép kết cấu dịch chuyển trong giới hạn thiết kế khi nhiệt độ thay đổi."},{"group":"ỨNG DỤNG","emoji":"🌉","title":"Đường ray","body":"Thiết kế đường ray phải tính đến thay đổi nhiệt độ để hạn chế nguy cơ biến dạng."},{"group":"ỨNG DỤNG","emoji":"🌉","title":"Đường ống dài","body":"Đường ống có thể đổi chiều dài theo nhiệt độ; mối nối và giá đỡ cần thiết kế phù hợp."},{"group":"ỨNG DỤNG","emoji":"🌉","title":"Dây điện ngoài trời","body":"Độ võng của dây điện thay đổi theo thời tiết nên cần khoảng cách an toàn thích hợp."},{"group":"ỨNG DỤNG","emoji":"🌉","title":"Nhiệt kế","body":"Sự thay đổi thể tích của chất lỏng hoặc đặc tính cảm biến có thể được dùng để đo nhiệt độ."},{"group":"ỨNG DỤNG","emoji":"🌉","title":"Lắp ghép kim loại","body":"Một số kỹ thuật lắp ghép tận dụng sự thay đổi kích thước của kim loại khi nóng hoặc lạnh."},{"group":"ỨNG DỤNG","emoji":"🌉","title":"Băng kép nhiệt","body":"Hai kim loại giãn nở khác nhau có thể làm dải ghép cong khi nhiệt độ thay đổi."},{"group":"ỨNG DỤNG","emoji":"🌉","title":"Bộ điều nhiệt","body":"Một số bộ điều nhiệt dùng biến đổi do nhiệt để đóng hoặc ngắt mạch ở ngưỡng nhất định."},{"group":"ỨNG DỤNG","emoji":"🌉","title":"Thông gió","body":"Không khí nóng thường nhẹ hơn không khí lạnh xung quanh trong điều kiện phù hợp, góp phần tạo dòng đối lưu."},{"group":"ỨNG DỤNG","emoji":"🌉","title":"Kính xây dựng","body":"Khung và kính cần lắp đúng kỹ thuật để tính đến thay đổi nhiệt độ và hạn chế nứt vỡ."},{"group":"THÍ NGHIỆM VÀ AN TOÀN","emoji":"🧪","title":"Mục đích","body":"Quan sát vật hoặc chất thay đổi khi nhiệt độ đổi rồi so sánh với dự đoán."},{"group":"THÍ NGHIỆM VÀ AN TOÀN","emoji":"🧪","title":"Dụng cụ","body":"Chỉ dùng bộ dụng cụ do giáo viên chuẩn bị và làm theo hướng dẫn an toàn."},{"group":"THÍ NGHIỆM VÀ AN TOÀN","emoji":"🧪","title":"Bước 1: quan sát","body":"Ghi hình dạng, kích thước hoặc vị trí mực chất lỏng trước khi thay đổi nhiệt độ."},{"group":"THÍ NGHIỆM VÀ AN TOÀN","emoji":"🧪","title":"Bước 2: thay đổi nhiệt độ","body":"Giáo viên hướng dẫn cách làm nóng hoặc làm lạnh phù hợp với dụng cụ."},{"group":"THÍ NGHIỆM VÀ AN TOÀN","emoji":"🧪","title":"Bước 3: quan sát lại","body":"Ghi nhận sự thay đổi và so sánh với trạng thái ban đầu."},{"group":"THÍ NGHIỆM VÀ AN TOÀN","emoji":"🧪","title":"Bước 4: đối chiếu","body":"So sánh kết quả với dự đoán và nêu điểm giống hoặc khác nếu có."},{"group":"THÍ NGHIỆM VÀ AN TOÀN","emoji":"🧪","title":"Giữ điều kiện ổn định","body":"Giữ các điều kiện khác tương tự và chỉ thay đổi yếu tố đang khảo sát."},{"group":"THÍ NGHIỆM VÀ AN TOÀN","emoji":"🧪","title":"Ghi kết quả trung thực","body":"Ghi những gì quan sát được, không sửa kết quả chỉ để khớp với dự đoán."},{"group":"THÍ NGHIỆM VÀ AN TOÀN","emoji":"🧪","title":"An toàn thí nghiệm","body":"Không chạm vật nóng, không đun bình kín và không tự làm thí nghiệm nguy hiểm khi thiếu giáo viên."},{"group":"THÍ NGHIỆM VÀ AN TOÀN","emoji":"🧪","title":"Kết luận quan sát","body":"Nếu vật tăng kích thước sau khi nóng lên, kết quả phù hợp với hiện tượng giãn nở trong điều kiện đó."},{"group":"ÔN TẬP VÀ KẾT LUẬN","emoji":"✨","title":"Sai lầm: vật nở giống nhau","body":"Mức độ giãn nở phụ thuộc vật liệu, nhiệt độ và điều kiện cụ thể."},{"group":"ÔN TẬP VÀ KẾT LUẬN","emoji":"✨","title":"Sai lầm: hạt tự lớn lên","body":"Nên giải thích bằng chuyển động nhiệt và khoảng cách trung bình giữa các hạt."},{"group":"ÔN TẬP VÀ KẾT LUẬN","emoji":"✨","title":"Sai lầm: quên áp suất khí","body":"Khí trong bình kín không thể tự do tăng thể tích như khí ngoài không gian mở; áp suất có thể tăng."},{"group":"ÔN TẬP VÀ KẾT LUẬN","emoji":"✨","title":"Ngoại lệ của nước","body":"Nước có tính chất giãn nở bất thường gần điểm đóng băng, nên không áp dụng quy luật chung tuyệt đối."},{"group":"ÔN TẬP VÀ KẾT LUẬN","emoji":"✨","title":"Câu hỏi 1","body":"Sự giãn nở vì nhiệt là gì? Hãy trả lời bằng một câu ngắn."},{"group":"ÔN TẬP VÀ KẾT LUẬN","emoji":"✨","title":"Câu hỏi 2","body":"Khi thanh kim loại nóng lên, chiều dài của nó thường thay đổi như thế nào?"},{"group":"ÔN TẬP VÀ KẾT LUẬN","emoji":"✨","title":"Câu hỏi 3","body":"Vì sao không nên đun nóng bình kín chứa khí?"},{"group":"ÔN TẬP VÀ KẾT LUẬN","emoji":"✨","title":"Câu hỏi 4","body":"Vì sao cầu cần khe co giãn? Hãy giải thích ngắn gọn."},{"group":"ÔN TẬP VÀ KẾT LUẬN","emoji":"✨","title":"Đáp án gợi ý","body":"Đó là sự thay đổi kích thước hoặc thể tích khi nhiệt độ đổi; phần lớn vật nở khi nóng và co khi lạnh."},{"group":"ÔN TẬP VÀ KẾT LUẬN","emoji":"✨","title":"Kết luận","body":"Hiểu sự giãn nở vì nhiệt giúp giải thích hiện tượng đời sống và thiết kế công trình, thiết bị an toàn hơn."}];const deck=document.getElementById('deck'),jump=document.getElementById('jump');slides.forEach((s,i)=>{const sec=document.createElement('section');sec.className='slide';sec.innerHTML='<span class="tag"></span><h1></h1><p></p><div class="emoji"></div>';sec.querySelector('.tag').textContent=String(i+1).padStart(2,'0')+' / 100 · '+s.group;sec.querySelector('h1').textContent=s.title;sec.querySelector('p').textContent=s.body;sec.querySelector('.emoji').textContent=s.emoji;deck.appendChild(sec);const opt=document.createElement('option');opt.value=i;opt.textContent=String(i+1).padStart(2,'0')+' · '+s.title;jump.appendChild(opt)});const pages=Array.from(document.querySelectorAll('.slide')),prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter'),bar=document.getElementById('bar');let current=0;function show(n){current=Math.max(0,Math.min(pages.length-1,n));pages.forEach((p,i)=>{p.classList.toggle('active',i===current);p.scrollTop=0});jump.value=String(current);prev.disabled=current===0;next.disabled=current===pages.length-1;counter.textContent=(current+1)+' / '+pages.length;bar.style.width=((current+1)/pages.length*100)+'%'}prev.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));jump.addEventListener('change',()=>show(Number(jump.value)));document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(pages.length-1)});show(0);</script></body></html>
